<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASARIN Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #11111a;
            --bg-card: #1c1c28;
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --accent-green: #00e396;
            --accent-red: #ff4560;
            --border-color: #2b2b3b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Sidebar Sederhana */
        .sidebar { width: 250px; background-color: var(--bg-card); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent-green); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .menu-item { padding: 12px 15px; background: rgba(0, 227, 150, 0.1); color: var(--accent-green); border-radius: 8px; font-weight: 500; cursor: pointer; border-left: 4px solid var(--accent-green); }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; font-weight: 600; }
        .btn-sync { background: var(--accent-green); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }

        /* KPI Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .kpi-title { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .kpi-value { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .text-green { color: var(--accent-green); font-size: 14px; }

        /* Chart Section */
        .chart-section { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-container { height: 300px; width: 100%; }

        /* Table Section */
        .table-section { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .table-section h3 { margin-bottom: 20px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 500; font-size: 14px; }
        td { font-size: 14px; }
        .badge { padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; background: rgba(0, 227, 150, 0.1); color: var(--accent-green); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <span>🏪</span> PASARIN
        </div>
        <div class="menu-item">📊 Dashboard</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Dashboard</h1>
            <button class="btn-sync" onclick="location.reload()">🔄 Refresh Data</button>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">TOTAL PENGELUARAN</div>
                <div class="kpi-value" id="kpi-total">Rp 0</div>
                <div class="text-green">Bulan ini</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">TRANSAKSI TERCATAT</div>
                <div class="kpi-value" id="kpi-count">0</div>
                <div class="text-green">Via Telegram</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">RATA-RATA TRANSAKSI</div>
                <div class="kpi-value" id="kpi-avg">Rp 0</div>
                <div class="text-green">Per struk</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">KATEGORI TERBESAR</div>
                <div class="kpi-value" id="kpi-top">-</div>
                <div class="text-green">Dominan</div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-header">
                <h3>📈 Pengeluaran per Kategori</h3>
            </div>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <div class="table-section">
            <h3>🕒 Transaksi Terakhir</h3>
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Toko / Keterangan</th>
                        <th>Kategori</th>
                        <th>Total (Rp)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Format Rupiah
        const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);

        async function loadDashboardData() {
            try {
                // 1. Load Data Kategori untuk Chart & KPI
                const catRes = await fetch('/api/analytics/categories');
                const catData = await catRes.json();
                
                let totalEx = 0;
                let topCat = "-";
                let maxCatVal = 0;

                const labels = [];
                const totals = [];

                catData.forEach(item => {
                    labels.push(item.category);
                    totals.push(item.total);
                    totalEx += item.total;
                    if(item.total > maxCatVal) {
                        maxCatVal = item.total;
                        topCat = item.category;
                    }
                });

                // Update KPI Cards
                document.getElementById('kpi-total').innerText = 'Rp ' + formatRp(totalEx);
                document.getElementById('kpi-top').innerText = topCat;

                // Render Chart (Dark Mode Optimized)
                const ctx = document.getElementById('expenseChart').getContext('2d');
                Chart.defaults.color = '#9e9e9e';
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Total (Rp)',
                            data: totals,
                            backgroundColor: '#00e396', // Hijau Neon
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { grid: { color: '#2b2b3b' }, beginAtZero: true },
                            x: { grid: { display: false } }
                        }
                    }
                });

                // 2. Load Data Tabel Transaksi
                const trxRes = await fetch('/api/transactions/recent');
                const trxData = await trxRes.json();
                
                document.getElementById('kpi-count').innerText = trxData.length;
                if(trxData.length > 0) {
                    document.getElementById('kpi-avg').innerText = 'Rp ' + formatRp(Math.round(totalEx / trxData.length));
                }

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                trxData.forEach(trx => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${trx.date}</td>
                            <td>${trx.merchant}</td>
                            <td><span class="badge">${trx.category}</span></td>
                            <td style="font-weight: 600;">Rp ${formatRp(trx.amount)}</td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        loadDashboardData();
    </script>
</body>
</html>
